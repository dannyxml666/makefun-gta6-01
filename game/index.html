<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vice Metropolis</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #000; font-family: monospace; color: #fff;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; box-sizing: border-box; padding: 20px;
    }
    .hud-top-right {
      position: absolute; top: 20px; right: 20px; text-align: right;
    }
    #cash-display { font-size: 28px; color: #ff0; font-weight: bold; text-shadow: 2px 2px #000; }
    #wanted-display { font-size: 22px; color: #ff5500; text-shadow: 1px 1px #000; }
    #minimap-canvas {
      width: 140px; height: 140px; border-radius: 50%; border: 2px solid #555;
      background: #111; margin-top: 10px; display: inline-block;
    }
    .hud-top-left {
      position: absolute; top: 20px; left: 20px;
    }
    .bar-container { width: 150px; height: 12px; background: #333; border: 1px solid #777; margin-bottom: 6px; }
    .bar-fill { height: 100%; width: 100%; background: #0f0; transition: width 0.2s; }
    #armour-fill { background: #0088ff; }
    #mission-panel {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); border: 1px solid #555; padding: 10px 20px;
      text-align: center; border-radius: 4px;
    }
    #controls-bar {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 4px; font-size: 13px; color: #ccc;
    }
    .screen-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 10;
    }
    h1 { font-size: 48px; color: #ff0055; text-shadow: 3px 3px #00ffff; margin-bottom: 20px; }
    .btn {
      background: #222; color: #fff; border: 2px solid #ff0055; padding: 12px 24px;
      font-size: 18px; font-family: monospace; cursor: pointer; margin: 8px; border-radius: 4px;
    }
    .btn:hover { background: #ff0055; color: #000; }
  </style>
</head>
<body>
  <canvas id="gl-canvas"></canvas>

  <div id="hud">
    <div class="hud-top-left">
      <div style="font-size: 14px; margin-bottom: 2px;">HEALTH</div>
      <div class="bar-container"><div id="health-bar" class="bar-fill"></div></div>
      <div style="font-size: 14px; margin-bottom: 2px;">ARMOUR</div>
      <div class="bar-container"><div id="armour-bar" class="bar-fill" id="armour-fill"></div></div>
    </div>

    <div id="mission-panel">
      <div id="mission-title" style="font-weight: bold; color: #ff0; margin-bottom: 4px;">MISSION: NONE</div>
      <div id="mission-desc" style="font-size: 13px;">Explore Vice Metropolis or start missions.</div>
    </div>

    <div class="hud-top-right">
      <div id="cash-display">$500</div>
      <div id="wanted-display">☆☆☆☆☆</div>
      <div><canvas id="minimap-canvas" width="140" height="140"></canvas></div>
    </div>

    <div id="controls-bar">
      MOVE: WASD / Arrows | ENTER/EXIT CAR / STEAL: E | PUNCH: F | PAUSE: P
    </div>
  </div>

  <div id="title-screen" class="screen-overlay">
    <h1>VICE METROPOLIS</h1>
    <button id="new-game-btn" class="btn">NEW GAME</button>
    <button id="continue-btn" class="btn" style="display:none;">CONTINUE</button>
  </div>

  <div id="pause-screen" class="screen-overlay" style="display:none;">
    <h2>PAUSED</h2>
    <button id="resume-btn" class="btn">RESUME</button>
  </div>

  <div id="busted-screen" class="screen-overlay" style="display:none;">
    <h2 style="color: #0088ff;">BUSTED</h2>
    <p>Final Cash: $<span id="final-cash">0</span></p>
    <button id="restart-btn" class="btn">PLAY AGAIN</button>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
